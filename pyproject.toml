[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniguard-evolved-v2"
version = "0.1.0"
description = "Distributed OpenEnv RL environment for autonomous VulnOps and MCP gateway defense"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "OmniGuard Team" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.31.0",
  "uvloop>=0.20.0; platform_system != 'Windows'",
  "httptools>=0.6.1",
  "pydantic>=2.9.2",
  "datasets>=2.21.0",
  "httpx>=0.27.2",
  "numpy>=2.1.1",
  "torch>=2.4.1",
  "transformers>=4.45.2",
  "trl>=0.11.1",
  "accelerate>=0.34.2",
  "peft>=0.13.2",
  "unsloth>=2024.11.11",
  "wandb>=0.18.3",
  "matplotlib>=3.9.2",
  "redis>=5.1.1",
  "orjson>=3.10.7",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2"
]
openenv = [
  "openenv-pytorch>=0.1.0"
]

[tool.setuptools.packages.find]
include = ["server*", "training*", "eval*", "worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
